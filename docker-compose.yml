services:
  statsdesk:
    build: .
    image: statsdesk-data-analysis:local
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    command:
      - analyze
      - --input
      - /input/wdi_2022.csv
      - --metadata
      - /input/dataset_metadata.json
      - --output-dir
      - /output
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - ./data:/input:ro
      - ./output:/output
