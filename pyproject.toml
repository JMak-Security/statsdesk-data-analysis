[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statsdesk-data-analysis"
version = "1.0.0"
description = "Reproducible descriptive analysis of an openly licensed WDI snapshot"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "JMak-Security" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cyclonedx-bom>=5",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[project.scripts]
statsdesk = "statsdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:asyncio"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["statsdesk"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
